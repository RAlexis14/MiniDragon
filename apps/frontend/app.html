<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniDragon • Personajes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MiniDragon</a>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary btn-sm" id="btnHistory">Historial</button>
      <a class="btn btn-outline-secondary btn-sm" href="/api/search/logs/export">Descargar CSV</a>
      <button class="btn btn-outline-light btn-sm" id="btnLogout">Logout</button>
    </div>
  </div>
</nav>

<main class="container my-4">
  <div class="input-group mb-3">
    <input id="q" class="form-control" placeholder="Buscar personaje (ej. Goku)">
    <button id="btnSearch" class="btn btn-primary">Buscar</button>
  </div>

  <div id="grid" class="row g-3"></div>

  <div class="d-flex gap-2 justify-content-center mt-4">
    <button class="btn btn-outline-secondary btn-sm" id="prev">« Prev</button>
    <button class="btn btn-outline-secondary btn-sm" id="next">Next »</button>
  </div>
</main>

<section class="container my-4">
  <h5>Historial</h5>
  <div class="table-responsive">
    <table class="table table-sm table-striped" id="tblHistory">
      <thead><tr>
        <th>#</th><th>Query</th><th>Resultados</th><th>Ejemplos</th><th>Fecha</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <h5 class="mt-4">Vistos</h5>
  <div class="table-responsive">
    <table class="table table-sm table-striped" id="tblViews">
      <thead><tr>
        <th>#</th><th>ID</th><th>Nombre</th><th>Fecha</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<!-- Modal detalle -->
<div class="modal fade" id="charModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="charTitle">Detalle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="charBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>

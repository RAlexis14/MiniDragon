<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniDragon • Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0">
          <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">MiniDragon</h1>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input id="username" class="form-control" placeholder="admin">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input id="password" type="password" class="form-control" placeholder="admin123">
            </div>
            <button id="btnLogin" class="btn btn-primary w-100">Login</button>
            <p class="text-muted small mt-3">
              Demo users: <code>admin/admin123</code> or <code>user/user123</code>
            </p>
            <div id="msg" class="text-danger small mt-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/js/login.js"></script>
</body>
</html>

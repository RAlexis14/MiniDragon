name: MiniDragon Backend (QA)
on:
  push:
    branches: [ "qa" ]
    paths: [ "apps/backend/**", "apps/frontend/**", "infra/docker-compose.yml", ".github/workflows/backend-docker.yml" ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minidragon:qa
          build-args: |
            FRONTEND_DIR=../../apps/frontend
